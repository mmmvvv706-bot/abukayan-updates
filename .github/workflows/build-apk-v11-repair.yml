name: Build AbuKayan V11 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip source
        run: |
          mkdir -p v11
          unzip -q AbuKayan-V11-source.zip -d v11
          test -f v11/settings.gradle.kts
          test -f v11/app/build.gradle.kts

      - name: Build APK
        working-directory: v11
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuKayan-V11-APK
          path: "**/*.apk"