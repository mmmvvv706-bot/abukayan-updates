name: Build Abu Kayan V11 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AbuKayan-V11-source.zip"
      - ".github/workflows/build-apk-v11.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract V11
        run: |
          mkdir -p v11
          unzip -q AbuKayan-V11-source.zip -d v11
          test -f v11/settings.gradle.kts
          test -f v11/app/build.gradle.kts

      - name: Build APK
        working-directory: v11
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuKayan-V11-APK
          path: v11/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error