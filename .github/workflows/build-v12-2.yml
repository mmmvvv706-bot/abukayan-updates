name: Build AbuKayan V12 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AbuKayan-V12-source.zip'
      - '.github/workflows/build-v12.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack V12 source
        run: mkdir -p v12 && unzip -q -o AbuKayan-V12-source.zip -d v12

      - name: Build V12 APK
        run: gradle -p v12 --no-daemon assembleDebug

      - name: Publish V12 APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuKayan-V12-debug-apk
          path: v12/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
