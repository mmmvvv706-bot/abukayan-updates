name: Build AbuKayan V12 APK (Fixed SDK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AbuKayan-V12-source.zip'
      - '.github/workflows/build-v12-3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3 because it tries to install the
      # removed 'tools' SDK package, which caused V12 workflow #1 to fail.
      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack V12 source
        run: |
          mkdir -p v12
          unzip -q -o AbuKayan-V12-source.zip -d v12
          test -f v12/settings.gradle.kts

      - name: Build V12 debug APK
        run: gradle -p v12 --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuKayan-V12-debug-apk
          path: v12/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
