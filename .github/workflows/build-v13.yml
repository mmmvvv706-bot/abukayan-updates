name: Build AbuKayan V13 APK (Navigation Fix)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AbuKayan-V13-source.zip'
      - '.github/workflows/build-v13.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip V13 source
        run: |
          mkdir -p v13
          unzip -q AbuKayan-V13-source.zip -d v13
          test -f v13/settings.gradle.kts
          test -f v13/app/build.gradle.kts

      - name: Build APK (using preinstalled SDK and Gradle)
        working-directory: v13
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuKayan-V13-APK
          path: v13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
